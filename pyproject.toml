[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chess-formula"
version = "0.1.0"
description = "Experiments on the description complexity of strong chess judgment"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Chess Formula contributors"}]
dependencies = [
  "duckdb>=1.1",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "python-chess>=1.999",
  "zstandard>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8"]

[project.scripts]
chess-formula = "chess_formula.cli:main"
chess-formula-uci = "chess_formula.uci:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_formula"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
